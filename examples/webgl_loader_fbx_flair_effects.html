<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - FBX loader + Lluvia y Neblina</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 12px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            border-radius: 8px;
            max-width: 280px;
            line-height: 1.6;
            z-index: 100;
        }
    </style>

</head>
<body>

	<div id="controls">
		<strong>Controles:</strong><br>
		↑ ↓: Velocidad de lluvia<br>
		R / G / B / W: Color de la lluvia<br>
		V: Agregar viento lateral<br>
		← →: Cambiar densidad de neblina<br>
		A / S / D / F: Color de la neblina<br>
	</div>

<div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader + Partículas de Lluvia + Neblina
</div>

<script type="importmap">
{
    "imports": {
        "three": "../build/three.module.js",
        "three/addons/": "./jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';
import Stats from 'three/addons/libs/stats.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { Audio, AudioListener, AudioLoader } from 'three';

const manager = new THREE.LoadingManager();
let camera, scene, renderer, stats, object, loader, guiMorphsFolder;
let mixer;
let rainParticles;
const clock = new THREE.Clock();

const params = { asset: 'Praying' };
const assets = ['Praying', 'morph_test'];

init();

// Variables globales de control
let rainSpeed = 1;
let windSpeed = 0;
let rainColor = 0xaaaaaa;
let fogDensity = 0.0025;
let fogColor = 0xaaaaaa;

// Detectar teclas presionadas
window.addEventListener('keydown', (event) => {
    switch (event.key) {
        case 'ArrowUp':
            rainSpeed += 0.5;
            break;
        case 'ArrowDown':
            rainSpeed = Math.max(0, rainSpeed - 0.5);
            break;
        case 'r':
        case 'R':
            changeRainColor(0xff0000);
            break;
        case 'g':
        case 'G':
            changeRainColor(0x00ff00);
            break;
        case 'b':
        case 'B':
            changeRainColor(0x0000ff);
            break;
        case 'w':
        case 'W':
            changeRainColor(0xffffff);
            break;
        case 'v':
        case 'V':
            windSpeed += 0.5;
            break;

        case 'ArrowLeft':
            fogDensity = Math.max(0.0005, fogDensity - 0.0005);
            scene.fog.density = fogDensity;
            break;
        case 'ArrowRight':
            fogDensity = Math.min(0.02, fogDensity + 0.0005);
            scene.fog.density = fogDensity;
            break;
        case 'a':
        case 'A':
            changeFogColor(0xff0000);
            break;
        case 's':
        case 'S':
            changeFogColor(0x00ff00);
            break;
        case 'd':
        case 'D':
            changeFogColor(0x0000ff);
            break;
        case 'f':
        case 'F':
            changeFogColor(0xffffff);
            break;
    }
});

function changeRainColor(color) {
    if (rainParticles) {
        rainParticles.material.color.setHex(color);
    }
}

function changeFogColor(color) {
    fogColor = color;
    scene.fog.color.setHex(color);
    scene.background.set(color);
}


function init() {
    const container = document.createElement('div');
    document.body.appendChild(container);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
    camera.position.set(100, 200, 300);

    scene = new THREE.Scene();

    // 🌫 Mejorar la niebla
    scene.fog = new THREE.FogExp2(0xaaaaaa, 0.0025);

    // Luz
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 5);
    hemiLight.position.set(0, 200, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 5);
    dirLight.position.set(0, 200, 100);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Suelo
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(2000, 2000),
        new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(2000, 20, 0x000000, 0x000000);
    grid.material.opacity = 0.2;
    grid.material.transparent = true;
    scene.add(grid);

    loader = new FBXLoader(manager);
    loadAsset(params.asset);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setAnimationLoop(animate);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 100, 0);
    controls.update();

    window.addEventListener('resize', onWindowResize);

    // Stats
    stats = new Stats();
    container.appendChild(stats.dom);

    const gui = new GUI();
    gui.add(params, 'asset', assets).onChange(function (value) {
        loadAsset(value);
    });
    guiMorphsFolder = gui.addFolder('Morphs').hide();

    // 🌄 HDRI de ambiente
    const rgbeLoader = new RGBELoader();
    rgbeLoader.load('models/rgbe/dikhololo_night_4k.hdr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.background = texture;
        scene.environment = texture;
    });

    // 🎧 Música de fondo
    const listener = new AudioListener();
    camera.add(listener);

    const sound = new Audio(listener);
    const audioLoader = new AudioLoader();
    audioLoader.load('models/rgbe/procura.models/rgbe/cerdo.mp4', function (buffer) {
        console.log("Audio cargado exitosamente");
        sound.setBuffer(buffer);
        sound.setLoop(true);
        sound.setVolume(1.5);
        sound.play(); // puede requerir interacción del usuario
    });


    // 🌧 Lluvia de partículas
    createRain();
}

function loadAsset( asset ) {

loader.load( 'models/fbx/' + asset + '.fbx', function ( group ) {

	if ( object ) {

		object.traverse( function ( child ) {

			if ( child.material ) {

				const materials = Array.isArray( child.material ) ? child.material : [ child.material ];
				materials.forEach( material => {

					if ( material.map ) material.map.dispose();
					material.dispose();

				} );

			}

			if ( child.geometry ) child.geometry.dispose();

		} );

		scene.remove( object );

	}

	//

	object = group;

	if ( object.animations && object.animations.length ) {

		mixer = new THREE.AnimationMixer( object );

		const action = mixer.clipAction( object.animations[ 0 ] );
		action.play();

	} else {

		mixer = null;

	}

	guiMorphsFolder.children.forEach( ( child ) => child.destroy() );
	guiMorphsFolder.hide();

	object.traverse( function ( child ) {

		if ( child.isMesh ) {

			// -----------------------------------------------------------
			// Aplicar un material de agua o translúcido al modelo
			child.material = new THREE.MeshStandardMaterial({
				color: 0xff3300,  // Color rojo acuático
				transparent: true,
				opacity: 1.0,
				roughness: 0.3,
				metalness: 1.0
			});
			// -----------------------------------------------------------

			child.castShadow = true;
			child.receiveShadow = true;

			if ( child.morphTargetDictionary ) {

				guiMorphsFolder.show();
				const meshFolder = guiMorphsFolder.addFolder( child.name || child.uuid );
				Object.keys( child.morphTargetDictionary ).forEach( ( key ) => {

					meshFolder.add( child.morphTargetInfluences, child.morphTargetDictionary[ key ], 0, 1, 0.01 );

				} );

			}

		}

	} );

	scene.add( object );

} );

}


function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function createRain() {
    const rainGeometry = new THREE.BufferGeometry();
    const rainCount = 20000; // más partículas para cubrir más espacio
    const positions = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount; i++) {
        positions[i * 3] = Math.random() * 4000 - 2000;     // X más ancho
        positions[i * 3 + 1] = Math.random() * 2000 + 500;  // Y más alto (caen desde más arriba)
        positions[i * 3 + 2] = Math.random() * 4000 - 2000; // Z más profundo
    }

    rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const rainMaterial = new THREE.PointsMaterial({
        color: 0xaaaaaa,
        size: 3.5,               // AUMENTA el tamaño de las gotas
        transparent: true,
        opacity: 1.5
    });

    rainParticles = new THREE.Points(rainGeometry, rainMaterial);
    scene.add(rainParticles);
}


function animate() {
    const delta = clock.getDelta();

    if (mixer) mixer.update(delta);

    if (rainParticles) {
        const positions = rainParticles.geometry.attributes.position.array;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
            // Cada gota
            positions[i * 3 + 1] -= rainSpeed; // Y (vertical)

            if (positions[i * 3 + 1] < -500) {
                // Si la gota llegó al suelo
                positions[i * 3 + 1] = 1000; // Reaparece arriba
                positions[i * 3] = Math.random() * 4000 - 2000; // Nueva posición X aleatoria
                positions[i * 3 + 2] = Math.random() * 4000 - 2000; // Nueva posición Z aleatoria
            }

            // Viento lateral
            positions[i * 3] += windSpeed * 0.1;
        }

        rainParticles.geometry.attributes.position.needsUpdate = true; // Muy importante
    }

    renderer.render(scene, camera);
    stats.update();
}


</script>

</body>
</html>
